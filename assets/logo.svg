<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <!-- Logo style MetLife -->
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0090DA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A4CE4E;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Left blue shape -->
  <circle cx="30" cy="40" r="20" fill="#0090DA" opacity="0.9"/>

  <!-- Right green shape -->
  <circle cx="60" cy="40" r="20" fill="#A4CE4E" opacity="0.9"/>

  <!-- Text -->
  <text x="100" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#333333">
    MetLife
  </text>
</svg>